name: My first workflow

on:
  pull_request: 
    branches: 
      - main

permissions: 
  pull-requests: write

jobs:
  my_jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Say Hello
        run: echo "Hello, Github Actions!"

      - name: Report Changed Files
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const prNumber = context.issue.number;
      
            const { data: files } = await github.rest.pulls.listFiles({
              owner,
              repo,
              pull_number: prNumber
            });
            // 1. Display all modified files
            console.log("Modified files: ");
            files.forEach(file => console.log(file.filename));

            // 2. Check snake_case naming convention
            const invalidFiles = files.filter(file =>
              !/^[a-z0-9]+(_[a-z0-9]+)*\.[a-z]+$/.test(file.filename.split("/").pop())
            );

            if (invalidFiles.length > 0) {
              console.log("⚠️ ALERT: These files do not follow snake_case naming:");
              invalidFiles.forEach(file => console.log(file.filename));
            } else {
              console.log("✅ All modified files follow the naming convention.");
            }

            // 3. Check whether content.js was modified
            if (files.some(file => file.filename.split("/").pop() === "content.js")) {
              console.log("🚨 ALERT: content.js has been modified in this pull request!");
            }else{
            console.log("content.js has not been modified in this pull request!");
            }
