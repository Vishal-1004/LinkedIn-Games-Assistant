name: My first workflow

on:
  pull_request: 
    branches: 
      - main

permissions: 
  pull-requests: write

jobs:
  my_jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Say Hello
        run: echo "Hello, Github Actions!"

      - name: Report Changed Files
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.issue.number;

            const files = await github.pagination(
              github.rest.pulls.listFiles,
                {
                  owner,
                  repo,
                  pull_number,
                  per_page: 100
                }
              );
              
            const fileList = files.map(file => {
              return `- **${file.status}** \`${file.filename}\` (+${file.additions}, -${file.deletions})`;
            }).join('\n');

            const body = [
              '## 📁 Pull Request File Change Report',
              '',
              `**Total files changed:** ${files.length}`,
              '',
              fileList || 'No changed files found.'
            ].join('\n');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pull_number,
              body
            });
        
